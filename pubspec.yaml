name: storm_blitz
description: "Storm Blitz - Council of Olympus card tactics game."
publish_to: 'none'

version: 1.0.1+9

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  webview_flutter: ^4.10.0
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  appsflyer_sdk: ^6.18.0
  app_tracking_transparency: ^2.0.7
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_app_check: ^0.4.5+2
  flutter_local_notifications: ^22.1.0
  connectivity_plus: ^7.3.0
  http: ^1.6.0
  device_info_plus: ^13.2.0
  flutter_secure_storage: ^10.3.1
  webview_flutter_wkwebview: ^3.26.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/additional_assets/icon2.png"
  image_path_ios: "assets/additional_assets/icon2.png"
  adaptive_icon_foreground: "assets/additional_assets/icon2.png"
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter:
  # Firebase is pulled in via CocoaPods (Podfile pins Firebase/Messaging for the
  # NSE). With Flutter's default Swift Package Manager ALSO resolving Firebase,
  # the build fails with "Redefinition of module 'Firebase'". Keep dependencies
  # on CocoaPods only for this project.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/
    - assets/additional_assets/
